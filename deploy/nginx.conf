# nginx site for cult of pons — serves on the server's IP until you add a domain.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cultofpons
#   sudo ln -s /etc/nginx/sites-available/cultofpons /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# No domain yet? This is a default_server catch-all, so http://<SERVER_IP> works
# right now. When you get a domain:
#   1) replace  server_name _;  with  server_name your.domain;
#   2) sudo nginx -t && sudo systemctl reload nginx
#   3) sudo certbot --nginx -d your.domain --redirect   (certbot writes the 443/TLS block)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;              # ← replace "_" with your.domain once DNS points here

    # SSE live stream (/api/stream) — must NOT be buffered; the connection stays open.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
